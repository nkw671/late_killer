name: latekiller
description: "Bus arrival alarm app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^17.2.3
  csv: ^6.0.0
  xml: ^6.5.0
  intl: ^0.19.0
  flutter_overlay_window: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stopdata.csv
