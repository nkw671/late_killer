name: bus_alarm_app
description: "버스 도착 정보를 실시간으로 확인하고 출발 알림을 주는 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 상태 관리
  provider: ^6.1.2

  # 네트워크 / API
  http: ^1.2.1
  xml: ^6.5.0           # 인천 버스 OpenAPI는 XML 응답

  # TTS (REQ-15, REQ-16)
  flutter_tts: ^4.0.2

  # 잠금화면 알림 (REQ-18, REQ-19)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 플로팅 오버레이 (REQ-20, REQ-21) - Android system alert window
  flutter_overlay_window: ^0.4.5

  # 로컬 저장 (즐겨찾기, 알람 설정 영속화)
  shared_preferences: ^2.2.3

  # 폰트
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
